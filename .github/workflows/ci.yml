name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    # Green runs take a few minutes; a hard timeout turns a hung runner into
    # a red build instead of a six-hour budget burn.
    timeout-minutes: 20
    env:
      # Compiler-warning budget. Raising it accepts a warning forever; read
      # the "Warning gate" step's printed list before you touch this number.
      MAX_WARNINGS: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Unit-Tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Warning gate
        # Counts unique `file:line:column` locations, not matching lines: the
        # compiler prints the same warning once per compilation pass. Both
        # logs are scanned so warnings in test targets count too — `swift
        # build` does not compile them, `swift test` does.
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/test.log" \
            > "$RUNNER_TEMP/compile.log"
          warnings=$(grep -E '^[^[:space:]]+:[0-9]+:[0-9]+: warning:' \
            "$RUNNER_TEMP/compile.log" | sort -u || true)
          locations=$(printf '%s' "$warnings" \
            | grep -oE '^[^[:space:]]+:[0-9]+:[0-9]+:' \
            | sort -u || true)
          if [ -n "$locations" ]; then
            count=$(printf '%s\n' "$locations" | wc -l | tr -d ' ')
          else
            count=0
          fi
          echo "Unique warning locations: $count (budget: $MAX_WARNINGS)"
          if [ -n "$warnings" ]; then
            echo "----- warnings -----"
            printf '%s\n' "$warnings"
            echo "--------------------"
          fi
          if [ "$count" -gt "$MAX_WARNINGS" ]; then
            echo "::error::$count compiler warning locations exceed the budget of $MAX_WARNINGS. Fix the new warning, or raise MAX_WARNINGS in .github/workflows/ci.yml and say in the commit message which warning it now pays for."
            exit 1
          fi
